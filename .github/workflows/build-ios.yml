
name: AirCard iOS Build

on:
  push:
    branches:
      - main
    paths:
      - "ios-app/**"
      - "rust-core/**"
      - "AirliftFFI.xcframework/**"
      - "project.yml"
      - "build-ios.sh"
      - "build-ipa.sh"
      - ".github/workflows/build-ios.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AirCard IPA
    runs-on: macos-15

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RUST_BACKTRACE: full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-core -> target

      - name: Verify build environment
        run: |
          echo "Repository:"
          pwd

          echo "Rust:"
          rustc --version
          cargo --version

          echo "Xcode:"
          xcodebuild -version

          echo "Project files:"
          ls -la
          ls -la rust-core
          test -f rust-core/Cargo.toml
          test -f rust-core/src/lib.rs

      - name: Build Rust XCFramework
        run: |
          bash ./build-ios.sh

      - name: Verify XCFramework
        run: |
          test -f AirliftFFI.xcframework/Info.plist
          plutil -lint AirliftFFI.xcframework/Info.plist
          echo "XCFramework generated successfully"

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Build IPA
        run: |
          bash build-ipa.sh Release

      - name: Verify IPA
        run: |
          test -f build/AirCard-iOS.ipa
          ls -lh build/AirCard-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-IPA
          path: build/AirCard-iOS.ipa
          if-no-files-found: error
          retention-days: 7
