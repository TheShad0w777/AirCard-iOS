
name: AirCard iOS Build

on:
  push:
    branches:
      - main
    paths:
      - "ios-app/**"
      - "rust-core/**"
      - "AirliftFFI.xcframework/**"
      - "project.yml"
      - "build-ios.sh"
      - "build-ipa.sh"
      - ".github/workflows/build-ios.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AirCard IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build Rust XCFramework
        run: |
          DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer bash build-ios.sh

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Build IPA
        run: |
          bash build-ipa.sh Release

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-IPA
          path: build/AirCard-iOS.ipa
          if-no-files-found: error
          retention-days: 7
